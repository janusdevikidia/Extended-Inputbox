name: Sync to Gerrit

# GitHub -> Gerrit pour les PUSH directs sur les branches (les Pull Requests passent par gerrit-pr.yml).
on:
  push:
    branches: [main, dev, REL1_43, REL1_47]
  workflow_dispatch:

permissions:
  contents: read

# Un seul run à la fois par branche, sans annuler un run en cours
concurrency:
  group: gerrit-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gerrit-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GERRIT_SSH_KEY }}

      - name: Clé d'hôte Gerrit
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 29418 gerrit.wikimedia.org >> ~/.ssh/known_hosts

      - name: Envoi des nouveaux commits vers Gerrit
        env:
          GERRIT_SSH_URL: ${{ secrets.GERRIT_SSH_URL }}
          BRANCH: ${{ github.ref_name }}
          BRANCH_MAP: "main:master"          # supprime-le si tu renommes main -> master
          GITHUB_ONLY_PATHS: ".github tests .gitattributes"
          GERRIT_COMMITTER_NAME: ${{ vars.GERRIT_COMMITTER_NAME }}    # optionnel
          GERRIT_COMMITTER_EMAIL: ${{ vars.GERRIT_COMMITTER_EMAIL }}  # optionnel (e-mail de ton compte Gerrit)
        run: bash .github/gerrit/gerrit-sync.sh
